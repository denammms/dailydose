<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP лендинг · стекло & частицы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* главный контейнер */
    .glass-wrapper {
      max-width: 1200px;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 40px;
      padding: 32px 28px 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    /* фон с размытыми кругами */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      background: #0a0a0a;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      will-change: transform;
    }

    .circle-1 {
      width: 600px;
      height: 600px;
      background: #00FF00;
      top: -150px;
      left: -150px;
      animation: floatCircle 18s infinite alternate ease-in-out;
    }

    .circle-2 {
      width: 500px;
      height: 500px;
      background: #FF1493;
      bottom: -100px;
      right: -100px;
      animation: floatCircle 22s infinite alternate-reverse ease-in-out;
    }

    .circle-3 {
      width: 400px;
      height: 400px;
      background: #00FF00;
      top: 40%;
      right: -50px;
      opacity: 0.2;
      animation: floatCircle 25s infinite alternate ease-in-out;
    }

    .circle-4 {
      width: 350px;
      height: 350px;
      background: #FF1493;
      bottom: 20%;
      left: -80px;
      opacity: 0.15;
      animation: floatCircle 20s infinite alternate-reverse ease-in-out;
    }

    @keyframes floatCircle {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 40px) scale(0.9); }
      100% { transform: translate(20px, -20px) scale(1.05); }
    }

    /* частицы */
    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(0) scale(0.8); opacity: 0.1; }
      50% { opacity: 0.7; transform: translateY(-120px) scale(1.4); }
      100% { transform: translateY(-260px) scale(0.4); opacity: 0.05; }
    }

    /* контент */
    .content {
      position: relative;
      z-index: 20;
      color: #ffffff;
    }

    /* логотип */
    .logo-area {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #00FF00 20%, #FF1493 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(0, 255, 0, 0.1);
    }

    /* описание VIP — плотный фон для читаемости */
    .vip-description {
      margin-bottom: 32px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 20px 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .vip-description h2 {
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
    }

    .vip-description h2 .highlight {
      background: linear-gradient(135deg, #00FF00, #FF1493);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .vip-description p {
      font-size: 1.05rem;
      color: #f0f0f0;
      max-width: 580px;
      line-height: 1.6;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      font-weight: 400;
    }

    /* кнопки */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 44px;
    }

    .btn {
      padding: 14px 36px;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: #00FF00;
      color: #0a0a0a;
      border: 1px solid #00FF00;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);
    }

    .btn-primary:hover {
      transform: scale(1.04) translateY(-3px);
      box-shadow: 0 0 50px rgba(0, 255, 0, 0.35);
      background: #66ff66;
      border-color: #66ff66;
    }

    .btn-secondary {
      background: #FF1493;
      color: #fff;
      border: 1px solid #FF1493;
      box-shadow: 0 0 30px rgba(255, 20, 147, 0.15);
    }

    .btn-secondary:hover {
      transform: scale(1.04) translateY(-3px);
      box-shadow: 0 0 50px rgba(255, 20, 147, 0.35);
      background: #ff4da6;
      border-color: #ff4da6;
    }

    .btn:active {
      transform: scale(0.94);
    }

    /* карточки преимуществ */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .glass-card {
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 24px 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      text-align: center;
      color: #ffffff;
      transform: scale(1);
    }

    .glass-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(0, 255, 0, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 255, 0, 0.08);
      background: rgba(25, 25, 40, 0.7);
    }

    .glass-card:nth-child(1):hover {
      border-color: #00FF00;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(0, 255, 0, 0.15);
    }
    .glass-card:nth-child(2):hover {
      border-color: #FF1493;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 20, 147, 0.2);
    }
    .glass-card:nth-child(3):hover {
      border-color: #00FF00;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(0, 255, 0, 0.15);
    }
    .glass-card:nth-child(4):hover {
      border-color: #FF1493;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 20, 147, 0.2);
    }

    .glass-card .icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: block;
    }
    .glass-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }
    .glass-card p {
      font-size: 0.85rem;
      color: #d0d0d0;
      line-height: 1.4;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    }

    /* адаптив для телефонов */
    @media (max-width: 640px) {
      .glass-wrapper {
        padding: 20px 16px 28px;
        border-radius: 28px;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .logo-text {
        font-size: 1.8rem;
      }

      .vip-description {
        padding: 16px 18px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .vip-description h2 {
        font-size: 1.8rem;
        color: #ffffff;
      }

      .vip-description p {
        font-size: 0.95rem;
        color: #f5f5f5;
      }

      .button-group .btn {
        flex: 1 1 100%;
        padding: 13px 20px;
        font-size: 0.9rem;
      }

      .cards-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .glass-card {
        padding: 18px 12px 16px;
        background: rgba(10, 10, 20, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .glass-card .icon {
        font-size: 1.8rem;
      }
      .glass-card h3 {
        font-size: 1rem;
        color: #ffffff;
      }
      .glass-card p {
        font-size: 0.78rem;
        color: #d0d0d0;
      }

      .circle-1 { width: 350px; height: 350px; top: -80px; left: -80px; opacity: 0.3; }
      .circle-2 { width: 300px; height: 300px; bottom: -60px; right: -60px; opacity: 0.3; }
      .circle-3 { width: 250px; height: 250px; opacity: 0.15; }
      .circle-4 { width: 200px; height: 200px; opacity: 0.1; }
    }

    @media (max-width: 420px) {
      .cards-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .glass-card {
        padding: 14px 10px 12px;
      }
      .glass-card .icon {
        font-size: 1.5rem;
      }
      .glass-card h3 {
        font-size: 0.9rem;
      }
      .glass-card p {
        font-size: 0.7rem;
      }
      .vip-description h2 {
        font-size: 1.5rem;
      }
      .logo-text {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- фон: размытые круги -->
  <div class="bg-canvas">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    <div class="circle circle-4"></div>
  </div>

  <!-- частицы -->
  <div class="particle-container" id="particleContainer"></div>

  <!-- основной контент -->
  <div class="glass-wrapper">
    <div class="content">
      <!-- логотип -->
      <div class="logo-area">
        <span class="logo-text">✦ Daily dose VIP</span>
      </div>

      <!-- описание VIP -->
      <div class="vip-description">
        <h2>Эксклюзивный <span class="highlight">доступ</span></h2>
        <p>Сочные фуллы со всех дорогих приваток собраны в нашей випке, пополнение ежедневное.</p>
      </div>

      <!-- кнопки -->
      <div class="button-group">
        <button class="btn btn-primary">Купить</button>
        <button class="btn btn-secondary">Написать</button>
      </div>

      <!-- карточки преимуществ -->
      <div class="cards-grid">
        <div class="glass-card">
          <span class="icon">⚡</span>
          <h3>Мгновенно</h3>
          <p>Доступ к контенту за секунды</p>
        </div>
        <div class="glass-card">
          <span class="icon">🔒</span>
          <h3>Безопасно</h3>
          <p>Шифрование и приватность</p>
        </div>
        <div class="glass-card">
          <span class="icon">🎯</span>
          <h3>Персонально</h3>
          <p>Индивидуальный подход</p>
        </div>
        <div class="glass-card">
          <span class="icon">🏆</span>
          <h3>VIP-поддержка</h3>
          <p>24/7, выделенная линия</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const container = document.getElementById('particleContainer');
      if (!container) return;

      function createParticles(count, color, shadowColor) {
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const size = 2 + Math.random() * 6;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = Math.random() * 100 + '%';
          particle.style.top = Math.random() * 100 + '%';
          const duration = 10 + Math.random() * 20;
          const delay = Math.random() * 15;
          particle.style.animationDuration = duration + 's';
          particle.style.animationDelay = delay + 's';
          particle.style.background = color || '#ffffff';
          particle.style.boxShadow = shadowColor || '0 0 20px 4px rgba(0, 255, 0, 0.2)';
          container.appendChild(particle);
        }
      }

      createParticles(35, '#00FF00', '0 0 25px 6px rgba(0, 255, 0, 0.2)');
      createParticles(30, '#FF1493', '0 0 25px 6px rgba(255, 20, 147, 0.2)');
      createParticles(20, '#ffffff', '0 0 20px 4px rgba(255, 255, 255, 0.1)');
    })();
  </script>
</body>
</html>
